<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Project With argocd setup</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            margin-top: 120px;
        }

        h1 {
            font-size: 55px;
            color: #38bdf8;
        }

        h2 {
            font-size: 30px;
            color: #22c55e;
        }

        p {
            font-size: 22px;
            margin-top: 20px;
        }

        .box {
            width: 70%;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
            background: #1e293b;
            box-shadow: 0px 0px 15px rgba(255,255,255,0.2);
        }

        .highlight {
            color: #facc15;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="box">

            <h1>🚀 DevOps CI/CD Pipeline with argocd</h1>

            <h2>Kubernetes + Jenkins + Helm</h2>

            <p>
                Successfully deployed using
                <span class="highlight">Jenkins CI/CD</span>
            </p>

            <p>
                Docker Image deployed into
                <span class="highlight">Kubernetes Cluster</span>
            </p>

            <p>
                Automated deployment using
                <span class="highlight">Helm Charts</span>
            </p>

            <p>
                Build Version: <span class="highlight">v1</span>
            </p>

        </div>

    </div>

</body>
</html>
